name: Crawl and update mods

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Crawler ausführen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python crawler/atlas.py crawl

      - name: Ergebnis committen
        run: |
          git config user.name "g1r-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data crawler/state.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)"
            git push
          fi
